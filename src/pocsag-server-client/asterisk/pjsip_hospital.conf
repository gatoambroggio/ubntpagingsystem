; ============================================================================
; pjsip_hospital.conf - Template inicial (modo cliente v1.0client standalone)
;
; IMPORTANTE: Este archivo se REGENERARA desde el panel admin cuando pulses
; "Aplicar a Asterisk". La configuracion final se genera desde la base de datos.
;
; SELF-CONTAINED: incluye [transport-udp] + endpoint + identify + registros.
; NO depende de pjsip_pocsag.conf ni de ningun otro archivo.
;
; pjsip.conf solo tiene: #include pjsip_hospital.conf
;
; Reemplazar IP_HOSPITAL y CAMBIAR_PASSWORD_XXXX antes del primer uso,
; o mejor: usar el panel admin (Parametros -> Extensiones -> Aplicar).
; ============================================================================

; === Transporte UDP (self-contained) ===
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; === Endpoint unico para llamadas entrantes del hospital ===
[hospital-inbound]
type=endpoint
context=pocsag-incoming
disallow=all
allow=ulaw,alaw
transport=transport-udp
aors=hospital-inbound
trust_id_inbound=yes
direct_media=no

[hospital-inbound]
type=aor
max_contacts=0

; Identify: asocia la IP del hospital al endpoint inbound
[hospital-ident]
type=identify
endpoint=hospital-inbound
match=IP_HOSPITAL

; --- Registro del interno 3000 ---
[reg-3000]
type=registration
transport=transport-udp
outbound_auth=auth-3000
server_uri=sip:IP_HOSPITAL:5060
client_uri=sip:3000@IP_HOSPITAL:5060
retry_interval=60
expiration=3600
contact_user=3000

[auth-3000]
type=auth
auth_type=userpass
username=3000
password=CAMBIAR_PASSWORD_3000

; --- Registro del interno 3001 ---
[reg-3001]
type=registration
transport=transport-udp
outbound_auth=auth-3001
server_uri=sip:IP_HOSPITAL:5060
client_uri=sip:3001@IP_HOSPITAL:5060
retry_interval=60
expiration=3600
contact_user=3001

[auth-3001]
type=auth
auth_type=userpass
username=3001
password=CAMBIAR_PASSWORD_3001

