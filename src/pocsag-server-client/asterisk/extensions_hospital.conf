; ============================================================================
; extensions_hospital.conf - IVR autocontenido (modo cliente v1.0client)
;
; Los internos 3000-3003 se registran en la central del hospital (ver
; pjsip_hospital.conf). Cuando la central enruta una llamada (177 o cualquiera
; de los 4 internos), cae en contexto pocsag-incoming y se redirige al IVR.
;
; AUTOCONTENIDO: el IVR vive en [pocsag-ivr] aqui mismo.
; Valida el codigo con pocsag_check.py ANTES de pedir el mensaje.
; ============================================================================

[pocsag-incoming]
exten => 177,1,Goto(pocsag-ivr,s,1)
exten => 3000,1,Goto(pocsag-ivr,s,1)
exten => 3001,1,Goto(pocsag-ivr,s,1)
exten => 3002,1,Goto(pocsag-ivr,s,1)
exten => 3003,1,Goto(pocsag-ivr,s,1)
exten => _X.,1,Goto(pocsag-ivr,s,1)
exten => h,1,Hangup()

[pocsag-ivr]
exten => s,1,NoOp(=== Paginacion hospitalaria POCSAG ===)
 same => n,Answer()
 same => n,Set(TIMEOUT(digit)=5)
 same => n,Set(TIMEOUT(response)=30)
 ; --- Paso 1: codigo ---
 same => n(loop),Playback(despues-del-tono-marque-codigo)
 same => n,Playback(beep)
 same => n,Read(CODE,,8,,3,5)
 same => n,GotoIf($["${CODE}" = ""]?fin)
 ; --- Validar codigo en la BD ---
 same => n,AGI(/var/lib/asterisk/agi-bin/pocsag_check.py,${CODE})
 same => n,GotoIf($["${POCSAG_VALID}" = "1"]?pedir_mensaje:codigo_invalido)
 same => n(codigo_invalido),Playback(codigo-inexistente)
 same => n,Playback(marque-otro-codigo)
 same => n,Wait(0.5)
 same => n,Goto(loop)
 ; --- Paso 2: mensaje ---
 same => n(pedir_mensaje),Playback(despues-de-la-senal-su-mensaje)
 same => n,Playback(beep)
 same => n,Read(MESSAGE,,16,,3,${POCSAG_MSJ_TIMEOUT})
 same => n,GotoIf($["${MESSAGE}" = ""]?mensaje_vacio:enviar)
 ; --- Procesamiento AGI (envia POCSAG) ---
 same => n(enviar),AGI(/var/lib/asterisk/agi-bin/pocsag_handler.py,${CALLERID(num)},${CODE},${MESSAGE})
 same => n,GotoIf($["${AGISTATUS}" = "SUCCESS"]?ok:fail)
 same => n(ok),Playback(confirmado)
 same => n,Hangup()
 same => n(fail),Playback(error-envio)
 same => n,Wait(1)
 same => n,Goto(loop)
 same => n(mensaje_vacio),Playback(mensaje-vacio)
 same => n,Goto(pedir_mensaje)
 same => n(fin),Hangup()