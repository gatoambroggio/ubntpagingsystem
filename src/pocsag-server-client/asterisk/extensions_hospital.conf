; ============================================================================
; extensions_hospital.conf - Ruteo de internos del hospital al IVR POCSAG
; v1.0client
;
; Los internos 3000-3003 se registran en la central del hospital (ver
; pjsip_hospital.conf). Cuando la central enruta una llamada (177 -> uno de
; los 4 internos), cae en contexto pocsag-incoming y se redirige al IVR 2184.
;
; Este archivo se incluye desde extensions.conf y NO lo sobreescribe el panel
; admin (generar_dialplan_conf solo regenera extensions_pocsag.conf).
; ============================================================================

[pocsag-incoming]
; 177: numero que el hospital enruta hacia el servidor
exten => 177,1,Goto(pocsag-incoming,2184,1)

; 3000-3003: los 4 internos registrados (cualquiera dispara el IVR)
exten => 3000,1,Goto(pocsag-incoming,2184,1)
exten => 3001,1,Goto(pocsag-incoming,2184,1)
exten => 3002,1,Goto(pocsag-incoming,2184,1)
exten => 3003,1,Goto(pocsag-incoming,2184,1)