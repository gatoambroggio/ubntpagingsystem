<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediGuard · Despacho</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#f1f5f9;--panel:#ffffff;--line:#e2e8f0;--txt:#0f172a;--mut:#64748b;--acc:#1d4ed8;--acc2:#0ea5e9;--acc3:#6366f1;--ok:#16a34a;--err:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;color:var(--txt);background:var(--bg);font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column}
.wrap{max-width:600px;margin:auto;padding:2rem 1.2rem;width:100%}
.head{text-align:center;margin-bottom:1.6rem}
.logo{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;margin:0 auto .8rem;background:linear-gradient(135deg,var(--acc),var(--acc3));color:#fff;font-size:30px;font-weight:800;box-shadow:0 6px 18px rgba(29,78,216,.2)}
h1{font-size:1.5rem;font-weight:800;color:var(--txt);letter-spacing:-.02em}
.sub{color:var(--mut);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.6rem;box-shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05);margin-bottom:1.2rem}
.card h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin-bottom:1rem;font-weight:600}
label{display:block;font-size:.7rem;color:var(--mut);margin-bottom:.3rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
input,textarea{width:100%;background:#fff;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:.6rem .7rem;font-size:.95rem;font-family:inherit;outline:none;transition:.15s}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
.list{position:relative;margin-top:.4rem}
ul{position:absolute;z-index:5;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:9px;max-height:240px;overflow:auto;list-style:none;padding:.3rem;box-shadow:0 8px 24px rgba(15,23,42,.1)}
li{padding:.5rem .6rem;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between}
li:hover{background:#f1f5f9}
.muted{font-size:.72rem;color:var(--mut)}
.tag{font-size:.62rem;color:var(--acc);font-weight:700;text-transform:uppercase}
.btn{width:100%;margin-top:1rem;cursor:pointer;border:none;border-radius:10px;padding:.75rem;font-weight:700;font-size:.9rem;background:linear-gradient(135deg,var(--acc),var(--acc3));color:#fff;box-shadow:0 4px 12px rgba(29,78,216,.25)}
.btn:hover{box-shadow:0 6px 18px rgba(29,78,216,.35)}
.btn-sm{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:8px;padding:.4rem .7rem;font-size:.8rem;font-family:inherit}
.btn-sm:hover{border-color:var(--acc);color:var(--acc)}
.toast{margin-top:1rem;padding:.7rem;border-radius:9px;font-size:.85rem;display:none}
.toast.show{display:block}
.toast.ok{background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.25);color:var(--ok)}
.toast.err{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.25);color:var(--err)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{color:var(--mut);font-weight:600;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:.4rem;border-bottom:1px solid var(--line)}
td{padding:.4rem;border-bottom:1px solid var(--line)}
.badge{padding:.1rem .45rem;border-radius:999px;font-size:.66rem;font-weight:700}
.badge.ok{background:rgba(22,163,74,.12);color:var(--ok)}
.badge.err{background:rgba(220,38,38,.12);color:var(--err)}
.badge.mut{background:rgba(100,116,139,.12);color:var(--mut)}
.stat{position:fixed;top:1rem;right:1rem;z-index:2}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .7rem;border-radius:999px;font-size:.7rem;background:rgba(22,163,74,.12);color:var(--ok);border:1px solid rgba(22,163,74,.25);font-weight:600}
.pill.off{background:rgba(220,38,38,.12);color:var(--err);border-color:rgba(220,38,38,.25)}
.hidden{display:none!important}
</style></head>
<body>
<div class="stat"><span id="h" class="pill">…</span></div>
<div class="wrap">
  <div class="head"><div class="logo" id="logo">⏧</div><h1 id="titulo">MediGuard</h1><div class="sub" id="subtitulo">Despacho de mensajes</div></div>
  <div class="card" id="sec-enviar">
    <h2>Enviar mensaje</h2>
    <label>Buscar destinatario</label>
    <input id="q" autocomplete="off" placeholder="Nombre, código o área...">
    <ul id="list" style="display:none"></ul>
    <div style="margin-top:1rem"><label>Mensaje alfanumérico</label><textarea id="msg" rows="3" placeholder="Escriba el mensaje al pager..."></textarea></div>
    <div id="tpl" style="margin-top:.6rem"></div>
    <button class="btn" onclick="send()">TRANSMITIR</button>
    <div id="res" class="toast"></div>
  </div>
  <div class="card" id="sec-hist">
    <h2 style="display:flex;justify-content:space-between;align-items:center">Historial <button class="btn-sm" onclick="descargarHistorial()">⇩ CSV</button></h2>
    <div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Interno</th><th>Código</th><th>Cap</th><th>Mensaje</th><th>Estado</th></tr></thead><tbody id="histBody"><tr><td colspan="6" style="text-align:center;color:var(--mut);padding:1rem">Cargando...</td></tr></tbody></table></div>
  </div>
</div>
<script>
let chosen=null,t=null,THEME={};
async function applyTheme(){
  try{THEME=await fetch('/api/theme').then(r=>r.json());}catch(e){THEME={};}
  const r=document.documentElement.style;
  const map={front_color_primario:'--acc',front_color_acento:'--acc2',front_color_fondo:'--bg',front_color_texto:'--txt'};
  for(const k in map){if(THEME[k])r.setProperty(map[k],THEME[k]);}
  if(THEME.front_titulo)document.getElementById('titulo').textContent=THEME.front_titulo;
  if(THEME.front_subtitulo)document.getElementById('subtitulo').textContent=THEME.front_subtitulo;
  if(THEME.front_logo)document.getElementById('logo').textContent=THEME.front_logo;
  if(THEME.front_seccion_enviar==='0')document.getElementById('sec-enviar').classList.add('hidden');
  if(THEME.front_seccion_historial==='0')document.getElementById('sec-hist').classList.add('hidden');
  document.title=(THEME.front_titulo||'MediGuard')+' · Despacho';
}
async function loadHistorial(){
  try{
    const r=await fetch('/api/historial/public').then(r=>r.json());
    const tb=document.getElementById('histBody');
    const rows=(r&&r.rows)||[];
    if(!rows.length){tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--mut);padding:1rem">Sin envíos</td></tr>';return;}
    tb.innerHTML=rows.map(x=>{const e=x.estado||'-';const cls=e==='enviado'?'ok':e==='error'?'err':'mut';return '<tr><td>'+(x.fecha_hora||'').slice(0,16)+'</td><td>'+(x.interno_origen||'-')+'</td><td>'+(x.codigo||'-')+'</td><td>'+(x.cap_code||'-')+'</td><td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+String(x.mensaje||'').replace(/"/g,'&quot;')+'">'+(x.mensaje||'')+'</td><td><span class="badge '+cls+'">'+e+'</span></td></tr>';}).join('');
  }catch(e){document.getElementById('histBody').innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--err);padding:1rem">Error al cargar historial</td></tr>';}
}
async function descargarHistorial(){
  try{const r=await fetch('/api/historial/public').then(r=>r.json());const rows=(r&&r.rows)||[];const lines=['fecha_hora,interno,codigo,cap_code,mensaje,baudios,estado,observaciones'];rows.forEach(x=>lines.push([x.fecha_hora,x.interno_origen,x.codigo,x.cap_code,JSON.stringify(x.mensaje||''),x.baudios,x.estado,JSON.stringify(x.observaciones||'')].join(',')));const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='historial_zetronpoc.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}catch(e){alert('No se pudo descargar el historial');}
}
const q=document.getElementById('q'),list=document.getElementById('list');
q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(async()=>{const r=await fetch('/api/pagers'+(q.value?('?q='+encodeURIComponent(q.value)):'')).then(r=>r.json()).catch(()=>[]);const g=await fetch('/api/grupos'+(q.value?('?q='+encodeURIComponent(q.value)):'')).then(r=>r.json()).catch(()=>[]);const out=[];(r||[]).filter(x=>x.activo).forEach(x=>out.push({c:x.codigo,l:((x.nombre||'')+' '+(x.apellido||'')).trim()||x.codigo,t:'pager'}));(g||[]).filter(x=>x.activo).forEach(x=>out.push({c:x.codigo,l:x.nombre||x.codigo,t:'grupo'}));list.innerHTML=out.map(x=>'<li onclick="pick(\''+x.c+'\',\''+(x.l||'').replace(/'/g,'')+'\')"><span>'+x.l+' <span class="muted">'+x.c+'</span></span><span class="tag">'+x.t+'</span></li>').join('');list.style.display=out.length?'block':'none';},180);});
document.addEventListener('click',e=>{if(e.target.id!=='q')list.style.display='none';});
function pick(c,l){chosen=c;q.value=l+' ('+c+')';list.style.display='none';}
async function send(){const tt=document.getElementById('res');if(!chosen){tt.className='toast show err';tt.textContent='Seleccione destinatario';return;}const m=document.getElementById('msg').value.trim();if(!m){tt.className='toast show err';tt.textContent='Escriba un mensaje';return;}tt.className='toast show ok';tt.textContent='Transmitiendo...';const r=await fetch('/api/enviar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:chosen,mensaje:m,origen:'publico'})}).then(r=>r.json());if(r.status==='enviado'||r.status==='encolado'){tt.className='toast show ok';tt.textContent=r.status==='encolado'?'Encolado para envío.':'Mensaje transmitido.';document.getElementById('msg').value='';loadHistorial();}else{tt.className='toast show err';tt.textContent='Error: '+(r.detalle||'fallo');}}
async function health(){try{const h=await fetch('/api/health').then(r=>r.json());const p=document.getElementById('h');p.textContent=h.status==='ok'?'EN LINEA':'CAÍDO';p.className='pill '+(h.status==='ok'?'':'off');}catch(e){}}
applyTheme();health();setInterval(health,20000);loadHistorial();
</script>
</body></html>
