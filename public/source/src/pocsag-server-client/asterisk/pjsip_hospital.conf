; ============================================================================
; pjsip_hospital.conf - Registros de los 4 internos contra la central del hospital
; v1.0client
;
; IMPORTANTE: reemplazar IP_HOSPITAL y las passwords por los datos reales
; que entregue el area de IT del hospital.
; Incluir este archivo desde pjsip.conf:  #include pjsip_hospital.conf
; ============================================================================

; --- Transporte (debe coincidir con el definido en pjsip.conf) ---
; Si la central del hospital usa TCP, crear un transport-tcp aqui.

; --- Registro del interno 3000 ---
[reg-3000]
type=registration
outbound_auth=auth-3000
server_uri=sip:IP_HOSPITAL
client_uri=sip:3000@IP_HOSPITAL
retry_interval=60
expiration=3600

[auth-3000]
type=auth
auth_type=userpass
username=3000
password=CAMBIAR_PASSWORD_3000

[3000]
type=endpoint
context=pocsag-incoming
disallow=all
allow=ulaw,alaw
auth=auth-3000
aors=3000

[3000]
type=aor
max_contacts=1


