; ============================================================================
; extensions_pocsag.conf - Dialplan IVR de paginación (variante cliente)
; v1.0client
;
; Diferencia con el servidor autónomo: la llamada entra desde la central del
; hospital hacia los internos 3000-3003. Cuando llega (por 177 o por cualquiera
; de los 4), se redirige al IVR de paginación 2184.
; ============================================================================

[pocsag-incoming]
; --- Redirección de los internos registrados en el hospital ---
; La central del hospital enruta el 177 a uno de los 4 internos libres.
; Cualquiera que atienda, ejecuta el mismo IVR de paginación.
exten => 3000,1,Goto(pocsag-incoming,2184,1)
exten => 3001,1,Goto(pocsag-incoming,2184,1)
exten => 3002,1,Goto(pocsag-incoming,2184,1)
exten => 3003,1,Goto(pocsag-incoming,2184,1)

; --- IVR de paginación (mismo flujo que el servidor autónomo) ---
exten => 2184,1,NoOp(=== Paginación hospitalaria (cliente) ===)
 same => n,Answer()
 same => n,Set(TIMEOUT(digit)=5)
 same => n,Set(TIMEOUT(response)=20)
 ; --- Paso 1: código ---
 same => n,Playback(marque-codigo)
 same => n,Playback(beep)
 same => n,Read(CODE,,8,,3,5)
 same => n,GotoIf($["${CODE}" = ""]?fin:error)
 ; --- Paso 2: mensaje ---
 same => n,Playback(marque-mensaje)
 same => n,Playback(beep)
 same => n,Read(MESSAGE,,16,,3,8)
 same => n,GotoIf($["${MESSAGE}" = ""]?fin:error2)
 ; --- Procesamiento AGI ---
 same => n,AGI(pocsag_handler.py,${CALLERID(num)},${CODE},${MESSAGE})
 same => n,GotoIf($["${AGISTATUS}" = "SUCCESS"]?ok:fail)
 same => n(ok),Playback(confirmado)
 same => n(fin),Hangup()
 same => n(fail),Playback(error-envio)
 same => n,Hangup()
 same => n(error),Playback(codigo-invalido)
 same => n,Hangup()
 same => n(error2),Playback(mensaje-invalido)
 same => n,Hangup()